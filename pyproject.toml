[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gse-guides"
version = "0.1.0"
description = "Scraper for Fannie Mae and Freddie Mac mortgage lending guidelines"
requires-python = ">=3.10"
dependencies = [
    "requests~=2.31",
    "beautifulsoup4~=4.12",
    "lxml>=5.0",
    "playwright~=1.40",
    "markdownify>=0.12",
    "pyyaml~=6.0",
    "click~=8.1",
    "tqdm~=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.0",
    "pytest-cov~=4.0",
    "responses~=0.24",
]
llm = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
]

[project.scripts]
gse-guides = "gse_guides.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -q"
